<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <!--Отображение логотипа на странице-->
    <link rel="icon" href="{% static 'icon.png' %}" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - ГБУЗ РХ АМКБ</title>
    <style>
        body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#e8f5e9 0%,#b2dfdb 100%);color:#263238;padding:20px;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;}
        .container{background:white;padding:40px;border-radius:10px;box-shadow:0 4px 15px rgba(0,0,0,0.1);max-width:500px;width:100%;}
        h1{color:#00695c;text-align:center;margin-bottom:10px;}
        .subtitle{text-align:center;color:#546e7a;margin-bottom:30px;}
        .form-group{margin-bottom:20px;}
        label{display:block;font-weight:bold;margin-bottom:5px;color:#004d40;}
        select,input{width:100%;padding:12px;border:1px solid #ccc;border-radius:5px;box-sizing:border-box;font-size:14px;}
        select:focus,input:focus{outline:none;border-color:#26a69a;box-shadow:0 0 5px rgba(38,166,154,0.3);}
        .required{color:#e53935;}
        button{width:100%;padding:14px;background:#26a69a;color:white;border:none;border-radius:5px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px;}
        button:hover{background:#00897b;}
        .messages{color:#c62828;background:#ffebee;padding:15px;margin-bottom:20px;border-radius:5px;border-left:4px solid #e53935;}
        .messages.success{color:#2e7d32;background:#e8f5e9;border-left-color:#4caf50;}
        .login-link{text-align:center;margin-top:20px;color:#546e7a;}
        .login-link a{color:#26a69a;text-decoration:none;font-weight:bold;}
        .login-link a:hover{text-decoration:underline;}
        .logo-header{text-align:center;margin-bottom:20px;}
        .logo-header h2{color:#00695c;margin:5px 0;}
        .logo-header p{color:#546e7a;margin:0;font-size:14px;}
        .row{display:flex;gap:15px;}
        .row .form-group{flex:1;}
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-header">
        <h1>Регистрация</h1>
        <p class="subtitle">Создайте новую учётную запись</p>

        {% if messages %}
            {% for message in messages %}
                <div class="messages {% if message.tags %}{{ message.tags }}{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="row">
                <div class="form-group">
                    <label>Фамилия <span class="required">*</span></label>
                    <input type="text" name="last_name" required placeholder="Иванов">
                </div>
                <div class="form-group">
                    <label>Имя <span class="required">*</span></label>
                    <input type="text" name="first_name" required placeholder="Иван">
                </div>
            </div>

            <div class="form-group">
                <label>Отчество</label>
                <input type="text" name="middle_name" placeholder="Иванович">
            </div>

            <div class="form-group">
                <label>Логин (email) <span class="required">*</span></label>
                <input type="email" name="login" required placeholder="example@mail.ru">
            </div>

            <div class="form-group">
                <label>Номер телефона</label>
                <input type="tel" name="phone_number" placeholder="+7 (999) 000-00-00">
            </div>
            <!--  Выбор отдела -->
            <div class="form-group">
                <label>Отдел</label>
                <select name="department">
                    <option value="">-- Выберите отдел --</option>
                    {% for dept in departments %}
                        <option value="{{ dept.id }}">{{ dept.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Выбор должности -->
            <div class="form-group">
                <label>Должность</label>
                <select name="position">
                    <option value="">-- Выберите должность --</option>
                    {% for pos in positions %}
                        <option value="{{ pos.id }}">{{ pos.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Выбор кабинета -->
            <div class="form-group">
                <label>Рабочий кабинет</label>
                <select name="office">
                    <option value="">-- Выберите кабинет --</option>
                    {% for office in offices %}
                        <option value="{{ office.id }}">
                            {% if office.number %}
                                {{ office.number }}
                            {% else %}
                                Не распределён
                            {% endif %}
                            {% if office.building %}
                                ({{ office.building.name }})
                            {% endif %}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Пароль <span class="required">*</span></label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>Подтверждение пароля <span class="required">*</span></label>
                <input type="password" name="password_confirm" required placeholder="••••••••">
            </div>

            <button type="submit">Зарегистрироваться</button>
        </form>
        <div class="login-link">
            Уже есть аккаунт? <a href="{% url 'login_view' %}">Войти</a>
        </div>
    </div>
 </body>
</html>
